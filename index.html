<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris Transaction Portal</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --bg-input: #1b253d; /* Visually distinct dark tone */
            --primary: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .portal-box {
            background-color: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .nav-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--primary);
        }

        .tab-link {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        .tab-link.active-tab {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .form-section {
            display: none;
        }

        .form-section.show-section {
            display: block;
        }

        .input-block {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        /* FIXED: Added high-visibility border colors and contrast fills */
        input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #212c4a;
        }

        .action-button {
            width: 100%;
            background: linear-gradient(to right, #f59e0b, #f97316);
            border: none;
            border-radius: 6px;
            color: #0b0f19;
            font-size: 15px;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .action-button:hover {
            opacity: 0.9;
        }

        .status-box {
            margin-top: 20px;
            background-color: #080c14;
            border: 1px solid var(--success);
            border-radius: 6px;
            padding: 12px;
            display: none;
        }

        .status-text {
            color: var(--success);
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="portal-box">
        <h1>SOLARIS</h1>

        <div class="nav-tabs">
            <button id="tab1" class="tab-link active-tab" onclick="openSection('signup')">Secure Signup</button>
            <button id="tab2" class="tab-link" onclick="openSection('transfer')">Portal Transfer</button>
        </div>

        <div id="section-signup" class="form-section show-section">
            <div class="input-block">
                <label>First Name</label>
                <input type="text" id="in-firstname" placeholder="e.g. Jacob">
            </div>
            <div class="input-block">
                <label>Last Name</label>
                <input type="text" id="in-lastname" placeholder="e.g. Smith">
            </div>
            <div class="input-block">
                <label>Email Address</label>
                <input type="email" id="in-email" placeholder="name@domain.com">
            </div>
            <div class="input-block">
                <label>Date of Birth</label>
                <input type="date" id="in-dob">
            </div>
            <div class="input-block">
                <label>Phone Number (Optional)</label>
                <input type="tel" id="in-phone" placeholder="5551234567">
            </div>
            <button type="button" class="action-button" onclick="submitSignupData()">Claim +100 SOLX Signup Bonus</button>
        </div>

        <div id="section-transfer" class="form-section">
            <div class="input-block">
                <label>Buyer Wallet Address</label>
                
            </div>
            <div class="input-block">
                <label>Merchant Wallet Address</label>
                
            </div>
            <div class="input-block">
                <label>Purchase Cost (SOLX)</label>
                <input type="number" id="in-price" value="30">
            </div>
            <button type="button" class="action-button" onclick="submitTransferData()">Authorize Payout</button>
        </div>

        <div id="status-display" class="status-box">
            <div id="status-message" class="status-text">Processing...</div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL GOOGLE APPS SCRIPT WEB APP EXTENSION DEPLOYMENT URL
        const TARGET_SHEET_API = "https://script.google.com/macros/s/AKfycbxx2hXWIzhESU3cWI3Jm90zElzs2rgWAca66pzLdTkC_SvXE3nMajTl0-eOkuUVrdBg/exec";

        function openSection(sectionName) {
            document.getElementById("status-display").style.display = "none";
            activeTab = sectionName;
            
            if (sectionName === "signup") {
                document.getElementById("tab1").classList.add("active-tab");
                document.getElementById("tab2").classList.remove("active-tab");
                document.getElementById("section-signup").classList.add("show-section");
                document.getElementById("section-transfer").classList.remove("show-section");
            } else {
                document.getElementById("tab2").classList.add("active-tab");
                document.getElementById("tab1").classList.remove("active-tab");
                document.getElementById("section-transfer").classList.add("show-section");
                document.getElementById("section-signup").classList.remove("show-section");
            }
        }

        // FIXED: Uses modern secure asynchronous text transfer pipelines compatible with Vercel architecture
        async function deliverToLedger(jsonData) {
            if (TARGET_SHEET_API === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE" || TARGET_SHEET_API === "") {
                alert("Please add your Google Web App Link to the TARGET_SHEET_API variable.");
                return;
            }

            const statusDisplay = document.getElementById("status-display");
            const statusMessage = document.getElementById("status-message");

            statusMessage.textContent = "Synchronizing ledger transaction...";
            statusDisplay.style.borderColor = "var(--primary)";
            statusMessage.style.color = "var(--primary)";
            statusDisplay.style.display = "block";

            try {
                await fetch(TARGET_SHEET_API, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(jsonData)
                });

                statusDisplay.style.borderColor = "var(--success)";
                statusMessage.style.color = "var(--success)";
                statusMessage.textContent = "Data successfully committed to the Google Sheet ledger!";

            } catch (error) {
                statusDisplay.style.borderColor = "var(--error)";
                statusMessage.style.color = "var(--error)";
                statusMessage.textContent = "Transmission failed. Verify Google script permissions.";
            }
        }

        function submitSignupData() {
            const fName = document.getElementById("in-firstname").value.trim();
            const lName = document.getElementById("in-lastname").value.trim();
            const emailAddr = document.getElementById("in-email").value.trim();
            const birthDate = document.getElementById("in-dob").value;
            const phoneNumber = document.getElementById("in-phone").value.trim();

            if (!fName || !lName || !emailAddr || !birthDate) {
                alert("Please complete all required fields to register.");
                return;
            }

            const dataPackage = {
                action: "create_wallet",
                first_name: fName,
                last_name: lName,
                email: emailAddr,
                dob: birthDate,
                phone: phoneNumber
            };

            deliverToLedger(dataPackage);

            document.getElementById("in-firstname").value = "";
            document.getElementById("in-lastname").value = "";
            document.getElementById("in-email").value = "";
            document.getElementById("in-dob").value = "";
            document.getElementById("in-phone").value = "";
}
function submitTransferData() {
const buyerAddress = document.getElementById("in-buyer").value.trim();
const merchantAddress = document.getElementById("in-merchant").value.trim();
const purchaseCost = document.getElementById("in-price").value;
if (!buyerAddress || !merchantAddress || !purchaseCost) {
alert("Please complete all parameters to push a transfer.");
return;
}
const dataPackage = {
action: "purchase_app",
buyer_wallet: buyerAddress,
merchant_wallet: merchantAddress,
base_price: purchaseCost
};
deliverToLedger(dataPackage);
document.getElementById("in-buyer").value = "";
document.getElementById("in-merchant").value = "";
}
