<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astrality Portal — Account Access</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f4f3ff;
      background:
        radial-gradient(ellipse at top, #30265c 0%, transparent 55%),
        #0c0b17;
    }

    .panel {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border: 1px solid #393453;
      border-radius: 20px;
      background: rgba(20, 18, 37, 0.96);
      box-shadow: 0 20px 70px #0005;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .brand p {
      margin: 0;
      color: #aaa4c8;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      padding: 5px;
      border-radius: 10px;
      background: #100e20;
    }

    .tabs button {
      flex: 1;
      border: 0;
      padding: 12px;
      border-radius: 7px;
      color: #bdb7d7;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
    }

    .tabs button.active {
      color: white;
      background: #6550d9;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d8d3ee;
      font-size: 13px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #393453;
      border-radius: 9px;
      outline: none;
      background: #100e20;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #8976ff;
      box-shadow: 0 0 0 3px #8976ff20;
    }

    .primary {
      width: 100%;
      margin-top: 7px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: linear-gradient(110deg, #7259ed, #a052dc);
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.6;
    }

    .message.success {
      display: block;
      color: #b5f7d0;
      background: #153526;
      border: 1px solid #286747;
    }

    .message.error {
      display: block;
      color: #ffc0c0;
      background: #381b26;
      border: 1px solid #713343;
    }

    .message.info {
      display: block;
      color: #d5d0ff;
      background: #211d40;
      border: 1px solid #453a79;
    }

    .hint {
      margin: 20px 0 0;
      text-align: center;
      color: #8e88aa;
      font-size: 12px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    .wallet {
      display: block;
      margin-top: 8px;
      padding: 10px;
      border-radius: 6px;
      background: #100e20;
      color: #d2caff;
      overflow-wrap: anywhere;
      user-select: all;
    }

    .copy {
      margin-top: 10px;
      padding: 9px 12px;
      border: 1px solid #6355a0;
      border-radius: 7px;
      color: white;
      background: #302752;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="panel">
    <header class="brand">
      <h1>Astrality</h1>
      <p>Your gateway to the Astrality ecosystem.</p>
    </header>

    <div class="tabs">
      <button id="signupTab" class="active" type="button">
        Create Account
      </button>
      <button id="loginTab" type="button">
        Sign In
      </button>
    </div>

    <form id="signupForm">
      <div class="field">
        <label for="displayName">Account Name</label>
        <input
          id="displayName"
          name="displayName"
          type="text"
          autocomplete="username"
          minlength="2"
          maxlength="40"
          required
          placeholder="Choose an account name"
        >
      </div>

      <div class="field">
        <label for="signupEmail">Email Address</label>
        <input
          id="signupEmail"
          name="email"
          type="email"
          autocomplete="email"
          maxlength="254"
          required
          placeholder="you@example.com"
        >
      </div>

      <div class="field">
        <label for="signupPassword">Password</label>
        <input
          id="signupPassword"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
          placeholder="At least 8 characters"
        >
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
          placeholder="Enter your password again"
        >
      </div>

      <button class="primary" id="signupButton" type="submit">
        Create My Account
      </button>
    </form>

    <form id="loginForm" class="hidden">
      <div class="field">
        <label for="walletAddress">Wallet Address</label>
        <input
          id="walletAddress"
          name="walletAddress"
          type="text"
          autocomplete="username"
          required
          placeholder="Enter your Astrality wallet address"
        >
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Enter your password"
        >
      </div>

      <button class="primary" id="loginButton" type="submit">
        Sign In
      </button>
    </form>

    <div id="message" class="message" role="status"
         aria-live="polite"></div>

    <p class="hint">
      Account registration and authentication are processed by the
      Astrality backend. Keep your password private.
    </p>
  </main>

  <script>
    "use strict";

    const API_URL = "/api/astrality";

    const signupForm = document.getElementById("signupForm");
    const loginForm = document.getElementById("loginForm");
    const signupTab = document.getElementById("signupTab");
    const loginTab = document.getElementById("loginTab");
    const signupButton = document.getElementById("signupButton");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    let currentMode = "signup";

    function showMessage(text, type = "info") {
      message.className = "message " + type;
      message.replaceChildren(document.createTextNode(text));
    }

    function clearMessage() {
      message.className = "message";
      message.replaceChildren();
    }

    function switchMode(mode) {
      currentMode = mode;
      clearMessage();

      const isSignup = mode === "signup";

      signupForm.classList.toggle("hidden", !isSignup);
      loginForm.classList.toggle("hidden", isSignup);

      signupTab.classList.toggle("active", isSignup);
      loginTab.classList.toggle("active", !isSignup);

      document.getElementById("displayName").required = isSignup;
      document.getElementById("signupEmail").required = isSignup;
      document.getElementById("signupPassword").required = isSignup;
      document.getElementById("confirmPassword").required = isSignup;

      document.getElementById("walletAddress").required = !isSignup;
      document.getElementById("loginPassword").required = !isSignup;
    }

    signupTab.addEventListener("click", () => switchMode("signup"));
    loginTab.addEventListener("click", () => switchMode("login"));

    async function callAPI(payload) {
      let response;

      try {
        response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        throw new Error(
          "Could not connect to the Astrality API. " +
          "Check that /api/astrality is deployed and accessible."
        );
      }

      const rawText = await response.text();
      let data;

      try {
        data = JSON.parse(rawText);
      } catch {
        throw new Error(
          "The server returned an invalid response. " +
          "Check your API deployment and server logs."
        );
      }

      if (!response.ok || data.success === false || data.error) {
        throw new Error(
          data.message ||
          data.error ||
          ("The server returned HTTP " + response.status + ".")
        );
      }

      if (data.success !== true) {
        throw new Error(
          data.message ||
          "The server did not confirm success. No success was assumed."
        );
      }

      return data;
    }

    function getWalletAddress(data) {
      return (
        data.walletAddress ||
        data.account?.walletAddress ||
        data.account?.wallet ||
        data.wallet ||
        ""
      );
    }

    function showWalletResult(walletAddress) {
      message.className = "message success";
      message.replaceChildren();

      const heading = document.createElement("strong");
      heading.textContent = "Account created successfully!";
      message.appendChild(heading);

      const explanation = document.createElement("p");
      explanation.textContent =
        "Your Astrality wallet address:";
      message.appendChild(explanation);

      const wallet = document.createElement("code");
      wallet.className = "wallet";
      wallet.textContent = walletAddress;
      message.appendChild(wallet);

      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.className = "copy";
      copyButton.textContent = "Copy Wallet Address";

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(walletAddress);
          copyButton.textContent = "Copied!";
        } catch {
          showMessage(
            "Select the wallet address above and copy it manually.",
            "info"
          );
        }
      });

      message.appendChild(copyButton);

      const loginPrompt = document.createElement("p");
      loginPrompt.textContent =
        "Save your wallet address. You will need it to sign in.";
      message.appendChild(loginPrompt);

      const loginNow = document.createElement("button");
      loginNow.type = "button";
      loginNow.className = "copy";
      loginNow.textContent = "Continue to Sign In";

      loginNow.addEventListener("click", () => {
        document.getElementById("walletAddress").value =
          walletAddress;
        switchMode("login");
      });

      message.appendChild(loginNow);
    }

    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const displayName =
        document.getElementById("displayName").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (displayName.length < 2) {
        showMessage(
          "Your account name must contain at least 2 characters.",
          "error"
        );
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "Creating Account...";

      showMessage("Contacting Astrality and creating your account...");

      try {
        const data = await callAPI({
          action: "signup",
          displayName,
          email,
          password
        });

        const walletAddress = getWalletAddress(data);

        if (!walletAddress) {
          showMessage(
            "The server reported success but did not return a wallet " +
            "address. Check the signup response and backend implementation.",
            "error"
          );
          return;
        }

        signupForm.reset();
        showWalletResult(walletAddress);

      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        signupButton.disabled = false;
        signupButton.textContent = "Create My Account";
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const walletAddress =
        document.getElementById("walletAddress").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      loginButton.disabled = true;
      loginButton.textContent = "Signing In...";

      showMessage("Verifying your account...");

      try {
        const data = await callAPI({
          action: "login",
          walletAddress,
          password
        });

        showMessage(
          data.message || "Sign-in successful.",
          "success"
        );

        // Only redirect if the backend explicitly supplies a destination.
        if (
          typeof data.redirectUrl === "string" &&
          data.redirectUrl.startsWith("/") &&
          !data.redirectUrl.startsWith("//")
        ) {
          window.location.assign(data.redirectUrl);
        }

      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }
    });

    switchMode("signup");
  </script>
</body>
</html>
